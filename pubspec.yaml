name: cyber_nova
description: Cyber Nova - AI-powered Legal Metrology Compliance System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  # ===== Path B: On-device local-first =====
  # SQLite on-device database for inspection history
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  # MIME detection for Gemini image uploads
  mime: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/sample_product_label.jpg
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
